# ============================================================
# NexAGI 主配置（功能/连接参数）
# 所有显示给玩家的文字都在 lang.yml 里改，这里只管功能
# ============================================================

# 实例名字：会带进给 AI 的上下文，也是多实例路由用的 key
instance: "生存服"

# 公屏触发词：玩家聊天里带了这个词才会叫 AI
trigger: "罗希"

# 中转地址（mc_ai_bridge.py 的 /mc/message）
bridge-url: "http://127.0.0.1:8899/mc/message"

# 本插件自己监听的本地端口，中转的 mc_say 工具会 POST /say 过来
# 每个实例的端口必须不同（生存服 8900、小游戏 8901 ...）
listen-port: 8900

# 访问令牌：留空 = 不校验（只监听 127.0.0.1，默认安全）
token: ""

# 同一玩家两次公屏呼叫的最小间隔（毫秒）
cooldown-ms: 1500

# ---- /agi 的打字机输出 ----
# 每几 tick 吐一次字（1 tick = 50ms）。2 = 每秒 10 次
stream-tick-period: 2
# 每次吐几个字。1 = 一个字一个字出
stream-chars-per-tick: 1

# 等待动画的光带速度：每帧相位增量，一轮约 1/该值 帧（帧 = stream-tick-period）
# 0.03 ≈ 33 帧 ≈ 3.3 秒一轮；越大越活跃
thinking-speed: 0.03

# 调试：把收发内容写进控制台
debug: false
# ---- AI 执行服务器指令 ----
# 关掉后 server_command 工具一律拒绝
command-enabled: true
# 禁用的指令（只比对第一个词，不受命名空间影响）
command-blacklist:
  - stop
  - restart
  - op
  - deop
  - ban
  - ban-ip
  - pardon
  - pardon-ip
  - kick
  - whitelist
  - plugins
  - pl
  - reload
  - execute
